[project]
name = "retail-analyst-agent"
version = "0.1.0"
description = "LLM agent that answers natural-language questions over a PostgreSQL database of supermarket prices, with an automated evaluation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # Streamlit needs pandas. 3.x works too, but on the Windows machine this was written
    # on, Application Control blocks one of its DLLs.
    "pandas<3",
    "plotly>=7.1.0",
    "psycopg[binary]>=3.3.9",
    "pydantic>=2.14.3",
    "pydantic-ai-slim[anthropic]>=2.68.0",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "sqlglot>=30.31.0",
    "streamlit>=1.67.0",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "ruff>=0.15",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
