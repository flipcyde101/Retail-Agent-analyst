# Evaluation set: 50 questions, 10 per category.
#
# answer_type says how the runner compares the agent's result with `expected`:
#   number   one figure, right if within 1 % of expected
#   text     one value (a date, a name), right if equal
#   rows     a small table; `ordered: true` means the order is part of the answer
#   refusal  the agent must say it cannot answer (answerable = false)
#
# `expected` is written by `uv run python -m evals.questions --update`; do not edit it.

questions:

# ---------------------------------------------------------------- lookup
- id: L01
  category: lookup
  question: How many price records are there for Carrefour stores?
  answer_type: number
  reference_sql: |
    SELECT count(*)
    FROM prices p JOIN locations l ON l.id = p.location_id
    WHERE l.chain = 'Carrefour'
    LIMIT 1
  expected: 30805
- id: L02
  category: lookup
  question: How many stores are in the database?
  answer_type: number
  reference_sql: |
    SELECT count(*) FROM locations LIMIT 1
  expected: 2285
- id: L03
  category: lookup
  question: How many products are in the catalogue?
  answer_type: number
  reference_sql: |
    SELECT count(*) FROM products LIMIT 1
  expected: 65826
- id: L04
