  question: What is the average price of olive oil in supermarkets in Madrid?
  answer_type: refusal
  reason: There are no stores in Madrid or anywhere outside France.
  reference_sql: |
    SELECT count(*) FROM locations WHERE city ILIKE '%madrid%' OR country <> 'FR' LIMIT 1
